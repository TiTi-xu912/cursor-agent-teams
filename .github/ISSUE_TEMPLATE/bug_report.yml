name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: 检查
      options:
        - label: 我已搜索现有 Issue
          required: true
        - label: 这不是安全漏洞；安全问题将按 SECURITY.md 私密报告
          required: true

  - type: input
    attributes:
      label: 版本
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    attributes:
      label: 环境
      description: 操作系统、Node.js、Cursor 版本及安装方式
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
    validations:
      required: true

  - type: textarea
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    attributes:
      label: 实际行为与日志
      description: 请删除 API Key、邮箱和本机敏感路径
    validations:
      required: true
